name: cron-timing-test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cron-timing-test.yml"
  schedule:
    - cron: "30 6 * * 1-5"   # 14:30 Beijing — test queue delay

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Log trigger info
        run: |
          echo "=========================================="
          echo "  event:      ${{ github.event_name }}"
          echo "  schedule:   cron(30 6 * * 1-5) → 14:30 CST"
          echo "=========================================="

      - name: Record actual start time
        run: |
          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          print(f"  GitHub job STARTED at: {now.strftime('%Y-%m-%d %H:%M:%S')} CST")
          print(f"  Weekday: {now.strftime('%A')}")
          print(f"==========================================")
          if "schedule" == "${{ github.event_name }}":
              delay = (now - now.replace(hour=14, minute=30, second=0, microsecond=0)).total_seconds() / 60
              if delay < 0:
                  print(f"  ⚠️ Job started BEFORE cron time ({delay:.1f} min)")
              else:
                  print(f"  ⏱️  Queue delay: {delay:.1f} minutes after 14:30 CST")
          else:
              print(f"  ℹ️  Triggered by push/manual — no delay measurement")
          print(f"==========================================")
          PY

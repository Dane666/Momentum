name: strategy-align-report
#
# 月度策略对齐 + 实盘日志报告 — 回应评估建议⑤(快照式回测对齐口径)与⑥(实盘交易日志)。
# 每月1日 16:00 CST 跑:
#   - tools/align_report.py       回测(OOS) vs 实盘信号 统一口径并排对比
#   - tools/trade_log.py          实盘持仓台账 + 已平仓盈亏统计
#   - tools/trade_journal.py --factors --push  策略/因子有效性明细
# 三项均 Bark 推送, 便于逐月监控"回测很美 / 实盘很骨感"的偏差是否收敛。
#
# Triggers:
#   Primary:  cron-job.org → POST workflow_dispatch   每月1日 16:00 CST
#             URL:  https://api.github.com/repos/Dane666/Momentum/actions/workflows/strategy-align-report.yml/dispatches
#             Body(JSON): {"ref":"main"}
#   Backup:   GitHub schedule cron               每月1日 16:00 CST (仅兜底)
#   Manual:   GitHub UI "Run workflow"
#
on:
  schedule:
    - cron: '0 8 1 * *'       # 08:00 UTC = 16:00 CST, 每月1日
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Restore DB cache (与 volume-price-scan 共享 state-vpscan)
        uses: actions/cache@v4
        with:
          path: qlib_pro_v16.db
          key: state-vpscan-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-vpscan-${{ runner.os }}-

      - name: Download DB baseline (if needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f qlib_pro_v16.db ] || [ "$(stat -c%s qlib_pro_v16.db 2>/dev/null || echo 0)" -lt 104857600 ]; then
            echo "DB 缺失或过小, 从 release db-baseline-v1 下载全量基准库..."
            gh release download db-baseline-v1 -p qlib_pro_v16.db --clobber
            echo "下载完成: $(du -h qlib_pro_v16.db | cut -f1)"
          else
            echo "DB 已存在(缓存命中), 跳过下载 ($(du -h qlib_pro_v16.db | cut -f1))"
          fi

      - name: 回测 vs 实盘 对齐报告 (Bark)
        run: python tools/align_report.py --push

      - name: 实盘交易日志 (Bark)
        run: python tools/trade_log.py --push

      - name: 策略/因子有效性明细 (Bark)
        run: python tools/trade_journal.py --factors --push

name: position-monitor
#
# 持仓监控 — 交易时间每半小时触发
# 主: cron-job.org → POST workflow_dispatch API  (准时 ±1s)
#     UTC cron: 0,30 1,2,3,5,6 * * 1-5
#     → CST: 09:30 10:00 10:30 11:00 11:30 13:00 13:30 14:00 14:30
#
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            qlib_pro_v16.db
            data/eod_last_date.txt
          key: state-v1-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-v1-${{ runner.os }}-
      - run: pip install -r requirements.txt && pip install mootdx>=0.11
      - name: Run monitor
        run: |
          python <<'PY'
          import sys;from pathlib import Path;p=Path('.').resolve()
          sys.path.insert(0,str(p.parent))
          import importlib.util
          s=importlib.util.spec_from_file_location('momentum',p/'__init__.py',submodule_search_locations=[str(p)])
          m=importlib.util.module_from_spec(s);sys.modules['momentum']=m;s.loader.exec_module(m)
          from tools.position_monitor import run;run()
          PY
      - name: Push tracking
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/picks_tracking.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "auto: update position tracking" && git push origin main; fi

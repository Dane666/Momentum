name: momentum-scan
#
# Trigger guide:
#   Primary:  cron-job.org → POST workflow_dispatch API   14:45 CST (±1s precision)
#   Backup:   GitHub schedule cron                       14:40 CST (±15min queue)
#   Manual:   GitHub UI "Run workflow" button
#   CI:       push to main
#
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mode:
        description: full=production scan  /  smoke=fast test
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
  schedule:
    - cron: "40 6 * * 1-5"   # 14:40 CST — backup if external cron fails

concurrency:
  group: momentum-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      MOMENTUM_LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Wait for 14:44 market window (schedule fallback only)
        if: github.event_name == 'schedule'
        run: |
          python <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import time
          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          target = now.replace(hour=14, minute=44, second=30, microsecond=0)
          if now < target:
              wait_sec = (target - now).total_seconds()
              print(f"SCHEDULE FALLBACK — waiting {wait_sec:.0f}s until 14:44:30")
              time.sleep(max(0, wait_sec))
          print(f"Running at {datetime.now(tz).strftime('%H:%M:%S')}")
          PY

      - name: Check China trading day
        id: calendar
        run: |
          python <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import chinese_calendar as cc
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          is_open = cc.is_workday(today)
          print(f"Date: {today}, trading_day={is_open}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"is_open={str(is_open).lower()}\n")
          PY

      - name: Run unit tests (push only)
        if: github.event_name == 'push'
        run: python -m pytest tests/test_backtest.py tests/test_fetcher.py tests/test_fetcher_local_fallback.py -q

      - name: Smoke scan (manual smoke trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'smoke'
        env:
          MOMENTUM_CODE_LIMIT: "20"
          MOMENTUM_MAX_IO_WORKERS: "6"
          MOMENTUM_ENABLE_FEISHU_NOTIFICATION: "true"
          MOMENTUM_LOG_FILE: scan_smoke.log
        run: python main.py --mode scan

      - name: Production scan (external cron / manual full / schedule backup)
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        env:
          MOMENTUM_ENABLE_FEISHU_NOTIFICATION: "true"
          MOMENTUM_LOG_FILE: scan_prod.log
        run: python main.py --mode scan

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-scan-logs
          path: "*.log"

name: momentum-scan
#
# Two-phase execution:
#   Phase 1 (14:25): Pre-fetch K-line data → warm SQLite cache
#   Phase 2 (14:44): Run scan with hot cache → Feishu notification by 14:45
#
# Triggers:
#   Primary:  cron-job.org → POST workflow_dispatch API   14:25 CST (precision ±1s)
#   Backup:   GitHub schedule cron                       14:40 CST (queued fallback)
#   Manual:   GitHub UI "Run workflow" button
#   CI:       push to main (unit tests only)
#
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mode:
        description: full=production scan  /  smoke=fast test
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

concurrency:
  group: momentum-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      MOMENTUM_LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install mootdx>=0.11

      - name: Restore caches
        id: caches
        uses: actions/cache@v4
        with:
          path: |
            qlib_pro_v16.db
            data/eod_last_date.txt
          key: state-v1-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-v1-${{ runner.os }}-

      - name: Import fundamentals & sector cache into DB (if missing)
        # fundamentals / stock_sector_cache 不在 CI 缓存里(仅本地构建), 这里从提交的 CSV 导入,
        # 使"绩优"过滤与热门题材在 CI 中可用。表已存在则跳过(幂等)。
        continue-on-error: true
        run: |
          python <<'PY'
          import os, sqlite3, csv
          db = os.environ.get('MOMENTUM_DB_PATH', 'qlib_pro_v16.db')
          con = sqlite3.connect(db)

          def rows(name):
              try:
                  return con.execute(f"SELECT COUNT(*) FROM {name}").fetchone()[0]
              except Exception:
                  return 0

          if rows('fundamentals') == 0 and os.path.exists('data/fundamentals.csv'):
              print("fundamentals 缺失, 从 data/fundamentals.csv 导入...", flush=True)
              con.execute("""CREATE TABLE IF NOT EXISTS fundamentals (
                  code TEXT, period_end TEXT, avail_from TEXT,
                  roe REAL, net_profit_yoy REAL, revenue_yoy REAL,
                  eps REAL, eps_annualized REAL, bvps REAL, industry TEXT,
                  PRIMARY KEY(code, period_end))""")
              with open('data/fundamentals.csv', newline='', encoding='utf-8') as f:
                  rd = csv.DictReader(f)
                  recs = []
                  for r in rd:
                      def num(x):
                          return float(x) if (x not in ('', None)) else None
                      recs.append((r['code'], r['period_end'], r['avail_from'],
                                   num(r['roe']), num(r['net_profit_yoy']), num(r['revenue_yoy']),
                                   num(r['eps']), num(r['eps_annualized']), num(r['bvps']),
                                   (r.get('industry') or None)))
                  con.executemany("INSERT OR REPLACE INTO fundamentals VALUES (?,?,?,?,?,?,?,?,?,?)", recs)
              con.commit()
              print(f"  导入 fundamentals {len(recs)} 行", flush=True)
          else:
              print(f"fundamentals: {rows('fundamentals')} 行 (已存在/跳过)", flush=True)

          if rows('stock_sector_cache') == 0 and os.path.exists('data/stock_sector_cache.csv'):
              print("stock_sector_cache 缺失, 从 data/stock_sector_cache.csv 导入...", flush=True)
              con.execute("""CREATE TABLE IF NOT EXISTS stock_sector_cache (
                  code TEXT, sector TEXT, update_time TEXT)""")
              with open('data/stock_sector_cache.csv', newline='', encoding='utf-8') as f:
                  rd = csv.DictReader(f)
                  recs = [(r['code'], r['sector'], r['update_time']) for r in rd]
                  con.executemany("INSERT OR REPLACE INTO stock_sector_cache VALUES (?,?,?)", recs)
              con.commit()
              print(f"  导入 stock_sector_cache {len(recs)} 行", flush=True)
          else:
              print(f"stock_sector_cache: {rows('stock_sector_cache')} 行 (已存在/跳过)", flush=True)

          con.close()
          PY

      - name: Pre-fetch K-line data (warm cache)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python <<'PY'
          import sys, os, time, logging
          from concurrent.futures import ThreadPoolExecutor, as_completed
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')

          # Bootstrap momentum package
          from pathlib import Path
          p = Path('.').resolve()
          sys.path.insert(0, str(p.parent))
          import importlib.util
          spec = importlib.util.spec_from_file_location('momentum', p / '__init__.py', submodule_search_locations=[str(p)])
          m = importlib.util.module_from_spec(spec)
          sys.modules['momentum'] = m
          spec.loader.exec_module(m)

          from momentum.data import load_or_fetch_kline, fetch_all_stock_codes, fetch_kline_from_api, init_db
          from momentum import config as cfg

          init_db()
          codes = fetch_all_stock_codes()
          codes = [c for c in codes if c.startswith(('60','00')) and 'ST' not in c][:200]
          print(f"Pre-fetching K-line for {len(codes)} stocks from {cfg.KLINE_START_DATE}...")

          start = time.time()
          ok = fail = 0
          with ThreadPoolExecutor(max_workers=20) as pool:
              futures = {pool.submit(load_or_fetch_kline, code, fetch_kline_from_api, cfg.KLINE_START_DATE): code for code in codes}
              for f in as_completed(futures):
                  code = futures[f]
                  try:
                      df = f.result(timeout=30)
                      if df is not None and not df.empty:
                          ok += 1
                      else:
                          fail += 1
                  except Exception:
                      fail += 1
          elapsed = time.time() - start
          print(f"Pre-fetch done: {ok} ok, {fail} fail in {elapsed:.0f}s")
          PY

      - name: Pre-fetch K-line for low-quality universe (warm cache)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -c "from tools.low_quality_scan import warm_cache; warm_cache()"

      - name: Warm full-universe K-line cache (for realtime fallback)
        # 全市场预热 kline_cache: 实时接口失败时, fetcher 三级降级(K线缓存)可覆盖全市场,
        # 而非仅 ~200 只. 快速路径=一次 bulk 实时行情 upsert 当日 bar(每日只补当天);
        # 兜底=逐只 load_or_fetch_kline 增量写库. 失败不阻断主流程.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python -c "from tools.kline_warm import warm_universe; warm_universe()"

      - name: Wait for 14:44 scan window
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import time
          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          target = now.replace(hour=14, minute=44, second=0, microsecond=0)
          wait_sec = (target - now).total_seconds()
          if 0 < wait_sec <= 1200:
              print(f"Pre-fetch done, waiting {wait_sec:.0f}s until 14:44:00 CST")
              time.sleep(max(0, wait_sec))
          else:
              print(f"Skip wait ({wait_sec:.0f}s outside 14:20-14:50 window), running now")
          print(f"Starting scan at {datetime.now(tz).strftime('%H:%M:%S')} CST")
          PY

      - name: Check China trading day
        id: calendar
        run: |
          python <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import chinese_calendar as cc
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          is_open = cc.is_workday(today)
          print(f"Date: {today}, trading_day={is_open}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"is_open={str(is_open).lower()}\n")
          PY

      - name: Run unit tests (push only)
        if: github.event_name == 'push'
        run: python -m pytest tests/test_backtest.py tests/test_fetcher.py tests/test_fetcher_local_fallback.py -q

      - name: Smoke scan (manual smoke trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'smoke'
        env:
          MOMENTUM_CODE_LIMIT: "20"
          MOMENTUM_MAX_IO_WORKERS: "6"
          MOMENTUM_LOG_FILE: scan_smoke.log
        run: python main.py --mode scan

      - name: Production scan (hot cache — finishes in ~1 min)
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        env:
          MOMENTUM_LOG_FILE: scan_prod.log
        run: python main.py --mode scan 2>&1 | tee scan_stdout.txt

      - name: C-Tail sneak attack scan
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          python -c "from tools.c_tail_scan import run; run()"
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/picks_tracking.json
          git diff --cached --quiet || (git commit -m "auto: add C-tail picks" && git pull --rebase origin main && git push origin main)

      - name: Save picks to tracking
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        run: |
          python <<'PY'
          import json, os, re
          from datetime import datetime
          picks = []
          try:
              with open('scan_stdout.txt','r') as f: text=f.read()
              for m in re.finditer(r'(\d{6})\s+(\S+)\s+(\d+\.\d{2})\s+', text):
                  code, name, price = m.groups()
                  if float(price)>0.1 and name not in ('代码','全市场'):
                      picks.append({'code':code,'name':name,'price':float(price)})
          except: pass
          if not picks: exit(0)
          # 提取止损/止盈价
          sl_map = {}
          for m in re.finditer(r'(\d{6})\s+\S+[\s\S]*?止损¥([\d.]+)[\s\S]*?止盈¥([\d.]+)', text):
              sl_map[m.group(1)] = (float(m.group(2)), float(m.group(3)))
          today=datetime.now().strftime('%Y-%m-%d')
          tracking=[]
          try:
              with open('data/picks_tracking.json','r') as f: tracking=json.load(f)
          except: pass
          if not any(p.get('date')==today and p.get('type') in ('STRATEGY', None) for p in tracking):
              for p in picks:
                  sl, tp = sl_map.get(p['code'], (p['price']*0.95, p['price']*1.10))
                  tracking.append({
                      'date':today,'code':p['code'],'name':p['name'],
                      'price':p['price'],'sl_price':sl,'tp_price':tp,
                      'status':'WATCHING',
                      'type': 'STRATEGY'
                  })
              with open('data/picks_tracking.json','w') as f: json.dump(tracking,f,ensure_ascii=False,indent=2)
              print(f'Saved {len(picks)} picks with SL/TP')
          # Sync new picks to stock_picks table in SQLite
          try:
              import sqlite3
              db_path = os.environ.get('MOMENTUM_DB_PATH', 'qlib_pro_v16.db')
              conn = sqlite3.connect(db_path)
              cursor = conn.cursor()
              cursor.execute('''CREATE TABLE IF NOT EXISTS stock_picks (
                  id INTEGER PRIMARY KEY AUTOINCREMENT, date TEXT, code TEXT, name TEXT,
                  price REAL, status TEXT, sl_price REAL, tp_price REAL, type TEXT,
                  exit_price REAL, pnl_pct REAL, trigger_type TEXT, trigger_time TEXT,
                  pnl_ratio REAL, track_status TEXT DEFAULT 'TRACKING',
                  track_count INTEGER DEFAULT 0, day1_pnl REAL, day2_pnl REAL,
                  day3_pnl REAL, max_pnl_3d REAL DEFAULT 0.0)''')
              for p in picks:
                  cursor.execute('SELECT id FROM stock_picks WHERE date=? AND code=?', (today, p['code']))
                  if cursor.fetchone(): continue
                  sl, tp = sl_map.get(p['code'], (p['price']*0.95, p['price']*1.10))
                  cursor.execute('''INSERT INTO stock_picks
                      (date,code,name,price,status,sl_price,tp_price,type,track_status,track_count,max_pnl_3d)
                      VALUES (?,?,?,?,?,?,?,?,?,?,?)''',
                      (today, p['code'], p['name'], p['price'], 'WATCHING', sl, tp,
                       'STRATEGY', 'TRACKING', 0, 0.0))
              conn.commit(); conn.close()
              print(f'Synced {len(picks)} picks to stock_picks table')
          except Exception as e: print(f'DB sync skipped: {e}')

          # Commit tracking to repo (with retry on push conflict from concurrent workflows like position-monitor)
          import subprocess as _sp, time
          _sp.run(['git','config','user.name','github-actions'])
          _sp.run(['git','config','user.email','actions@github.com'])
          _sp.run(['git','add','data/picks_tracking.json'])
          r=_sp.run(['git','commit','-m','auto: add picks for '+today],capture_output=True)
          if r.returncode==0:
              for attempt in range(3):
                  _sp.run(['git','pull','--rebase','origin','main'])
                  pr=_sp.run(['git','push','origin','main'],capture_output=True)
                  if pr.returncode==0:
                      print(f'Pushed picks_tracking.json (attempt {attempt+1})')
                      break
                  print(f'Push attempt {attempt+1} failed, retrying...')
                  time.sleep(2)
              else:
                  print('ERROR: failed to push picks_tracking.json after 3 attempts')
          PY

      - name: Low-position quality scan (低位绩优股)
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        continue-on-error: true
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          python -c "from tools.low_quality_scan import run; run(prefetch=False)"
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/picks_tracking.json
          git diff --cached --quiet || (git commit -m "auto: add low-quality picks" && git pull --rebase origin main && git push origin main)

      - name: Push scan + tracking report
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          python <<'PY'
          import json, os, requests
          from datetime import datetime

          def bark_push(title, body):
              key = os.environ.get('BARK_DEVICE_KEY','').strip()
              if not key: return
              if key.startswith('http'):
                  parts = key.rstrip('/').split('/')
                  key = parts[-1] if parts[-1] else (parts[-2] if len(parts)>1 else key)
              requests.post('https://api.day.app/push',
                  json={'device_key':key,'title':title,'body':body[:3800],'group':'Momentum'},
                  timeout=10)

          # Scan picks
          picks = []
          try:
              with open('data/picks_tracking.json') as f: tracking = json.load(f)
              today = datetime.now().strftime('%Y-%m-%d')
              picks = [p for p in tracking if p['date'] == today]
          except: pass

          lines = [f'🔍 尾盘选股 | {today}']
          for pk in picks:
              lines.append(f"  {pk['code']} {pk['name']}: ¥{pk['price']:.2f}")

          # Tracking report from DB
          try:
              import sqlite3
              def _dw(s):
                  w=0
                  for c in str(s):
                      cp=ord(c)
                      if (0x1100<=cp<=0x115F or 0x2E80<=cp<=0xA4CF or
                          0xAC00<=cp<=0xD7A3 or 0xF900<=cp<=0xFAFF or
                          0xFF01<=cp<=0xFF60): w+=2
                      else: w+=1
                  return w
              def _pd(s,w):
                  d=_dw(str(s))
                  return str(s)+' '*(w-d) if d<w else str(s)
              def _p(v,w=7):
                  if v is None: return _pd('  -   ',w)
                  return _pd(f'{v:+.1f}%',w)

              conn = sqlite3.connect(os.environ.get('MOMENTUM_DB_PATH','qlib_pro_v16.db'))
              cur = conn.cursor()
              cur.execute("SELECT code,name,date,price,track_count,track_status,day1_pnl,day2_pnl,day3_pnl,max_pnl_3d,type FROM stock_picks WHERE track_count>0 ORDER BY date DESC LIMIT 12")
              rows = cur.fetchall()
              conn.close()
              if rows:
                  icons={'STRATEGY':'🎯','MANUAL':'📋','C_TAIL':'🎯'}
                  sep='━'*56
                  t_lines=['📊 策略表现监控日报',sep,
                           f'{_pd("名称",16)}{_pd("标识",4)}{_pd("T+1",8)}{_pd("T+2",8)}{_pd("T+3",8)}{_pd("3D最高",8)}{_pd("止损",6)}状态',sep]
                  up=0;sl=0;slr=0
                  for r in rows:
                      cd,nm,dt,pr,cn,st,d1,d2,d3,mx,pt=r
                      done=' ✅' if st=='FINISHED' else '    '
                      mx_v=mx if mx and mx!=0 else None
                      if mx_v and mx_v>0: up+=1
                      icon=icons.get(pt,'📌')
                      t_lines.append(f'{_pd(nm,16)}{_pd(icon,4)}{_p(d1)}{_p(d2)}{_p(d3)}{_p(mx_v)}{_pd("   - ",6)}{done}')
                  t_lines.append(sep)
                  t=len(rows)
                  t_lines.append(f'💹 3D最高为正: {up}/{t} ({up/t*100:.0f}%)')
                  t_lines.append('🎯 策略选股 | 📋 模拟选股')
                  bark_push('策略表现监控日报', '\n'.join(t_lines))
          except: pass

          bark_push(f'尾盘选股 {today}', '\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-scan-logs
          path: "*.log"

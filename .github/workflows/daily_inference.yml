# Phase 2: LightGBM 每日推理工作流 (已激活, 只读推荐通道)
# ---------------------------------------------------------------
# 作用: 从 GitHub Release 下载最新模型 -> 对当日因子数据打分 -> 输出 Top-K 推荐 -> Bark 推送。
# 注意: 本工作流独立于现有 volume-price-scan(规则策略), 产出单独通道的模型推荐,
#       不写入生产选股/不修改现有策略(纯只读 Bark 推荐, 不自动交易)。
# 模型资产: 已发布至 release `lgbm-model-v1` (model_v1.txt 原生 Booster 文本 + model_v1.pkl 兜底 + model_meta.json),
#       本工作流运行时下载. 推理端 load_model 优先用 model_v1.txt(版本无关, 规避 sklearn 包装器 pickle 跨版本报错).
# 触发方式: **GitHub 原生 schedule(主) + workflow_dispatch(手动兜底)**。
#       本通道产出的是"次日开盘才用"的推荐, 对时延不敏感, 因此接受 GitHub cron 的延迟/偶发漏跑;
#       一旦当晚没收到 Bark, 次日开盘前手动 Run workflow 补跑即可(数据同源, 结果一致)。
#       时点选择: 19:07 CST(11:07 UTC) —— 刻意避开本仓库其他工作流集中的 07:30~08:30 UTC,
#       且避开整点/半点(GitHub cron 高峰排队最严重的时刻), 以提高派发成功率。
#       ⚠️ 已知: GitHub 原生 schedule 在本仓库不可靠(2026-08-04 确诊 volume-price-scan/momentum-scan
#       漏派发)。对时延敏感的盘中工作流请改用 cron-job.org 主触发; 本工作流因不敏感故直接用原生 cron。
#       如需升级为 cron-job.org 精确触发, 配置模板见 docs/cron-job-daily-inference.md。
#       交易日门禁: gate job 用 chinese_calendar 拦截节假日空跑(cron 1-5 含法定假日);
#       仅对 schedule 生效, 手动 workflow_dispatch 一律放行(便于开盘前补跑)。
name: daily-inference

on:
  schedule:
    - cron: '7 11 * * 1-5'      # 11:07 UTC = 19:07 CST, 周一至周五(盘后, 次日开盘前用)
  workflow_dispatch:            # 手动兜底: schedule 漏跑时开盘前补跑
  # repository_dispatch:
  #   types: [daily-inference]

permissions:
  contents: read

jobs:
  # 交易日门禁: schedule 每周一至周五触发, 但节假日(春节/国庆等)休市, 空跑会推出陈旧推荐.
  # 仅对 schedule 生效; 手动 workflow_dispatch 一律放行(便于开盘前补跑/调试)。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.cal.outputs.run }}
    steps:
      - name: Check China trading day
        id: cal
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "非 schedule 触发 (${{ github.event_name }}) -> 强制运行"
            exit 0
          fi
          pip install -q chinese_calendar
          IS_OPEN=$(python -c "import chinese_calendar as cc; from datetime import date; print(str(cc.is_workday(date.today())).lower())")
          echo "run=$IS_OPEN" >> "$GITHUB_OUTPUT"
          echo "schedule 触发, A股交易日=$IS_OPEN"

  infer:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -q --upgrade pip
          # lightgbm 固定为训练版本 4.7.0: 模型 pkl 用 4.7.0 训练, 跨版本反序列化会报
          # 'super' object has no attribute 'get_params' (sklearn 包装器类层级不匹配).
          pip install -q "pandas" "numpy" "lightgbm==4.7.0" "pyarrow" "requests"

      - name: Restore market DB (release db-baseline-v1)
        run: |
          gh release download db-baseline-v1 -p "qlib_pro_v16.db" --clobber || \
          gh release download db-baseline-v1 -p "*.db" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import sector cache CSV
        run: |
          python - <<'PY'
          import sqlite3, csv, glob, os
          db="qlib_pro_v16.db"
          con=sqlite3.connect(db)
          cur=con.cursor()
          cur.execute("SELECT COUNT(*) FROM stock_sector_cache")
          if cur.fetchone()[0]==0:
              for f in glob.glob("data/stock_sector_cache*.csv"):
                  with open(f, newline="", encoding="utf-8") as fh:
                      rd=csv.reader(fh); cols=next(rd)
                      idx=[cols.index(c) for c in ("code","sector","update_time")]
                      rows=[(r[idx[0]], r[idx[1]], r[idx[2]]) for r in rd if len(r)>max(idx)]
                  cur.executemany("INSERT OR IGNORE INTO stock_sector_cache(code,sector,update_time) VALUES(?,?,?)", rows)
                  print(f"imported {len(rows)} from {f}")
          con.commit(); con.close()
          PY

      - name: Warm latest K-lines (Tencent history API)
        # 复用 volume-price-scan.yml 已验证的增量预热逻辑(importlib 注册 momentum + 腾讯历史接口补到当日).
        run: |
          python <<'PY'
          import logging, sys, sqlite3, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')
          p = Path('.').resolve(); sys.path.insert(0, str(p.parent))
          import importlib.util
          s = importlib.util.spec_from_file_location('momentum', p/'__init__.py', submodule_search_locations=[str(p)])
          m = importlib.util.module_from_spec(s); sys.modules['momentum']=m; s.loader.exec_module(m)
          try:
              from momentum.data import load_or_fetch_kline, fetch_kline_from_api, init_db
              init_db()
              con = sqlite3.connect('qlib_pro_v16.db')
              codes = [r[0] for r in con.execute(
                  "SELECT DISTINCT code FROM kline_cache WHERE code GLOB '60*' OR code GLOB '00*' OR code GLOB '30*' OR code GLOB '68*'").fetchall()]
              con.close()
              codes = [c for c in codes if 'ST' not in c]
              print(f"[warm] 目标 {len(codes)} 只 (kline_cache 现有, 增量补最新交易日)", flush=True)
              t0 = time.time(); ok = fail = 0
              def w(c):
                  try:
                      df = load_or_fetch_kline(c, fetch_kline_from_api, '2024-01-01')
                      return 1 if (df is not None and not df.empty) else 0
                  except Exception:
                      return 0
              with ThreadPoolExecutor(max_workers=20) as pool:
                  futs = {pool.submit(w, c): c for c in codes}
                  for f in as_completed(futs):
                      r = f.result()
                      ok += 1 if r else 0; fail += 0 if r else 1
              print(f"[warm] 完成: {ok} ok / {fail} fail in {time.time()-t0:.0f}s", flush=True)
              con = sqlite3.connect('qlib_pro_v16.db')
              print(f"[warm] kline_cache 最新交易日: {con.execute('SELECT MAX(trade_date) FROM kline_cache').fetchone()[0]}", flush=True)
              con.close()
          except Exception as e:
              print(f"[warm] 预热异常(继续, 推理将沿用已有数据): {e}")
          PY

      - name: Generate factor panel (当日)
        run: |
          python tasks/factor_engineering/factor_pipeline.py --db qlib_pro_v16.db

      - name: Download model from Release
        run: |
          gh release download lgbm-model-v1 -p "model_v1.pkl" --clobber
          gh release download lgbm-model-v1 -p "model_meta.json" --clobber
          gh release download lgbm-model-v1 -p "model_v1.txt" --clobber
          mkdir -p tasks/model_training/models
          mv model_v1.pkl tasks/model_training/models/
          mv model_meta.json tasks/model_training/models/
          mv model_v1.txt tasks/model_training/models/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inference -> Top-K
        run: |
          python tasks/model_inference/02_generate_scores.py --panel tasks/factor_engineering/output/factors_panel_full.parquet
          python tasks/model_inference/03_select_topk.py --k 10

      - name: Bark push (模型推荐)
        if: ${{ env.BARK_DEVICE_KEY != '' }}
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          python - <<'PY'
          import sys, json, glob
          from pathlib import Path
          import importlib.util
          # 引导 momentum 包以复用已验证的 bark_notify(POST /push, 正确处理 device_key)
          p = Path('.').resolve(); sys.path.insert(0, str(p.parent))
          s = importlib.util.spec_from_file_location('momentum', p/'__init__.py', submodule_search_locations=[str(p)])
          m = importlib.util.module_from_spec(s); sys.modules['momentum']=m; s.loader.exec_module(m)
          from momentum.tools.tracking_utils import bark_notify
          from momentum.tools.market_timing import timing_gate
          fs = sorted(glob.glob("tasks/model_inference/output/topk_*.json"))
          if not fs:
              print("无 topk 文件"); raise SystemExit(0)
          data = json.loads(Path(fs[-1]).read_text())
          picks = data.get("picks", [])
          # 盘中警示: 定时跑在 19:07 CST(收盘后)数据是结算收盘价; 但若用户在盘中手动补跑,
          # 增量预热拿到的是当日"未收盘"的实时快照 —— 因子/涨停判定都建立在半截 K 线上,
          # 收盘前仍会变。此时给推送打标, 避免误当成最终推荐直接下单。
          from datetime import datetime, timezone, timedelta
          now_cst = datetime.now(timezone(timedelta(hours=8)))
          intraday = (now_cst.weekday() < 5) and (9*60+15 <= now_cst.hour*60+now_cst.minute <= 15*60+5)
          # ---- 市场择时闸门: 暴跌熔断 / 强势·中性·弱势 ----
          gate = timing_gate()
          verdict = gate["verdict"]
          state = verdict.get("state")
          label = verdict.get("label", "未知")
          action = verdict.get("action", "全买 Top10")
          # 状态 emoji: 熔断⛔ 强势🟢 中性🟡 弱势🔴 未知⚪
          state_emoji = {"熔断": "⛔", "强势": "🟢", "中性": "🟡",
                         "弱势": "🔴", "未知": "⚪"}.get(label, "⚪")

          # 暴跌硬熔断 -> 直接推"暂停开仓", 不推买点清单
          if gate["halt"]:
              title = f"⛔ LightGBM 暂停开仓 ({data.get('date')})"
              body = (
                  f"⛔ 风险门禁触发: {gate['reason']}\n"
                  f"今日模型 Top{len(picks)} 推荐暂停推送, 不新开仓。\n"
                  f"已有持仓继续按 持有10日 / 止损-8% 监控。")
              bark_notify(title, body)
              print("Bark 推送(熔断暂停):", title)
              raise SystemExit(0)

          flag = "⚠️盘中快照 " if intraday else ""
          title = f"{flag}{state_emoji} LightGBM Top{len(picks)} {label} ({data.get('date')})"
          # 按状态决定实际推荐买入的只数(弱势仅前3 / 中性前5 / 强势全10)
          if state == 'bear':
              buy_n = min(3, len(picks))
          elif state == 'ranging':
              buy_n = min(5, len(picks))
          else:
              buy_n = len(picks)
          shown = picks[:buy_n]
          lines = [f"{i+1}. {pk['code']} 分{pk['score']:.3f} @{pk['close']}"
                   for i, pk in enumerate(shown)] or ["无候选"]
          if buy_n < len(picks):
              lines.append(f"…(弱势/中性市仅推前{buy_n}只, 余{len(picks)-buy_n}只暂不宜买)")
          # 择时 verdict 一行
          lines += ["", f"{state_emoji} 市场{label}: {verdict.get('msg','')}",
                    f"👉 建议: {action}"]
          # 执行规则(已由 06_execution_feasibility 实证: 次日开盘可买 85.7%, 跳空中位数 0.00%;
          # 回踩限价单存在逆向选择, 不采用)。篮子等权, 勿单押。
          lines += ["", "买: 次日开盘价等权买入(勿追回踩低吸)",
                    "卖: 持有10日到期 / 止损-8%(不叠加止盈)", "篮子分散, 单票勿超1/5仓"]
          if intraday:
              lines += ["", f"⚠️ 本次于盘中 {now_cst:%H:%M} 运行, 基于未收盘实时快照,",
                        "收盘前名单仍会变。建议收盘后重跑或直接等 19:07 定时。"]
          body = "\n".join(lines)
          bark_notify(title, body)
          print("Bark 推送完成:", title)
          PY

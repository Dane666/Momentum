# Phase 2: LightGBM 每日推理工作流 (已激活, 只读推荐通道)
# ---------------------------------------------------------------
# 作用: 从 GitHub Release 下载最新模型 -> 对当日因子数据打分 -> 输出 Top-K 推荐 -> Bark 推送。
# 注意: 本工作流独立于现有 volume-price-scan(规则策略), 产出单独通道的模型推荐,
#       不写入生产选股/不修改现有策略(纯只读 Bark 推荐, 不自动交易)。
# 模型资产: 已发布至 release `lgbm-model-v1` (model_v1.pkl + model_meta.json), 本工作流运行时下载。
# 激活: 已启用 schedule(15:30 CST 兜底) + workflow_dispatch(主触发由 cron-job.org POST, 见 docs/cron-job-daily-inference.md).
name: daily-inference

on:
  schedule:
    - cron: '30 7 * * 1-5'     # 07:30 UTC = 15:30 CST, 周一至周五 (兜底; 主触发见 cron-job.org)
  workflow_dispatch:
  # repository_dispatch:
  #   types: [daily-inference]

permissions:
  contents: read

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pandas numpy lightgbm pyarrow

      - name: Restore market DB (release db-baseline-v1)
        run: |
          gh release download db-baseline-v1 -p "qlib_pro_v16.db" --clobber || \
          gh release download db-baseline-v1 -p "*.db" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import sector cache CSV
        run: |
          python - <<'PY'
          import sqlite3, csv, glob, os
          db="qlib_pro_v16.db"
          con=sqlite3.connect(db)
          cur=con.cursor()
          cur.execute("SELECT COUNT(*) FROM stock_sector_cache")
          if cur.fetchone()[0]==0:
              for f in glob.glob("data/stock_sector_cache*.csv"):
                  with open(f, newline="", encoding="utf-8") as fh:
                      rd=csv.reader(fh); cols=next(rd)
                      idx=[cols.index(c) for c in ("code","sector","update_time")]
                      rows=[(r[idx[0]], r[idx[1]], r[idx[2]]) for r in rd if len(r)>max(idx)]
                  cur.executemany("INSERT OR IGNORE INTO stock_sector_cache(code,sector,update_time) VALUES(?,?,?)", rows)
                  print(f"imported {len(rows)} from {f}")
          con.commit(); con.close()
          PY

      - name: Warm latest K-lines (Tencent history API)
        # 复用 volume-price-scan.yml 已验证的增量预热逻辑(importlib 注册 momentum + 腾讯历史接口补到当日).
        run: |
          python <<'PY'
          import logging, sys, sqlite3, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')
          p = Path('.').resolve(); sys.path.insert(0, str(p.parent))
          import importlib.util
          s = importlib.util.spec_from_file_location('momentum', p/'__init__.py', submodule_search_locations=[str(p)])
          m = importlib.util.module_from_spec(s); sys.modules['momentum']=m; s.loader.exec_module(m)
          try:
              from momentum.data import load_or_fetch_kline, fetch_kline_from_api, init_db
              init_db()
              con = sqlite3.connect('qlib_pro_v16.db')
              codes = [r[0] for r in con.execute(
                  "SELECT DISTINCT code FROM kline_cache WHERE code GLOB '60*' OR code GLOB '00*' OR code GLOB '30*' OR code GLOB '68*'").fetchall()]
              con.close()
              codes = [c for c in codes if 'ST' not in c]
              print(f"[warm] 目标 {len(codes)} 只 (kline_cache 现有, 增量补最新交易日)", flush=True)
              t0 = time.time(); ok = fail = 0
              def w(c):
                  try:
                      df = load_or_fetch_kline(c, fetch_kline_from_api, '2024-01-01')
                      return 1 if (df is not None and not df.empty) else 0
                  except Exception:
                      return 0
              with ThreadPoolExecutor(max_workers=20) as pool:
                  futs = {pool.submit(w, c): c for c in codes}
                  for f in as_completed(futs):
                      r = f.result()
                      ok += 1 if r else 0; fail += 0 if r else 1
              print(f"[warm] 完成: {ok} ok / {fail} fail in {time.time()-t0:.0f}s", flush=True)
              con = sqlite3.connect('qlib_pro_v16.db')
              print(f"[warm] kline_cache 最新交易日: {con.execute('SELECT MAX(trade_date) FROM kline_cache').fetchone()[0]}", flush=True)
              con.close()
          except Exception as e:
              print(f"[warm] 预热异常(继续, 推理将沿用已有数据): {e}")
          PY

      - name: Generate factor panel (当日)
        run: |
          python tasks/factor_engineering/factor_pipeline.py --db qlib_pro_v16.db

      - name: Download model from Release
        run: |
          gh release download lgbm-model-v1 -p "model_v1.pkl" --clobber
          gh release download lgbm-model-v1 -p "model_meta.json" --clobber
          mkdir -p tasks/model_training/models
          mv model_v1.pkl tasks/model_training/models/
          mv model_meta.json tasks/model_training/models/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inference -> Top-K
        run: |
          python tasks/model_inference/02_generate_scores.py --panel tasks/factor_engineering/output/factors_panel_full.parquet
          python tasks/model_inference/03_select_topk.py --k 10

      - name: Bark push (模型推荐)
        if: ${{ env.BARK_DEVICE_KEY != '' }}
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          import glob
          fs=sorted(glob.glob("tasks/model_inference/output/topk_*.json"))
          if not fs:
              print("无 topk 文件"); raise SystemExit(0)
          data=json.loads(Path(fs[-1]).read_text())
          picks=data.get("picks",[])
          key=os.environ.get("BARK_DEVICE_KEY","")
          if not key: print("未配置 BARK_DEVICE_KEY"); raise SystemExit(0)
          title=f"🤖 LightGBM 模型推荐 Top{len(picks)} ({data.get('date')})"
          body="\n".join(f"{p['code']} 分{p['score']:.3f} @{p['close']}" for p in picks) or "无候选"
          url=f"https://api.day.app/{key}/{urllib.parse.quote(title)}/{urllib.parse.quote(body)}"
          urllib.request.urlopen(url, timeout=10)
          print("Bark 推送成功")
          PY

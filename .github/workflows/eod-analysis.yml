name: eod-analysis
#
# 盘后数据归档与初筛 — 每日 16:00 CST
#
on:
  push:
    branches: [main]
    paths:
      - "tools/eod_analysis.py"
      - "tools/stock_picks_tracker.py"
      - "data/db.py"
      - ".github/workflows/eod-analysis.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"   # 16:00 CST

# DB (qlib_pro_v16.db) persisted via actions/cache auto-save after job

permissions:
  contents: write   # 提交 data/monitor_archive_stats.json(归档统计快照)

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            qlib_pro_v16.db
            data/eod_last_date.txt
            data/monitor_archive_stats.json
          key: state-v1-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-v1-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Check China trading day
        id: calendar
        run: |
          python3 -c "
          import os; from datetime import datetime; from zoneinfo import ZoneInfo
          import chinese_calendar as cc
          t=datetime.now(ZoneInfo('Asia/Shanghai')).date()
          o=cc.is_workday(t)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'is_open={str(o).lower()}\n')
          "
      - name: Run EOD analysis
        if: >
          github.event_name != 'schedule' ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        run: |
          python <<'PY'
          import sys; from pathlib import Path; p=Path('.').resolve()
          sys.path.insert(0,str(p.parent))
          import importlib.util
          spec=importlib.util.spec_from_file_location('momentum',p/'__init__.py',submodule_search_locations=[str(p)])
          m=importlib.util.module_from_spec(spec);sys.modules['momentum']=m;spec.loader.exec_module(m)
          from tools.eod_analysis import run; run()
          PY
      - name: Persist archive stats (归档统计入库, 日报告只列最近 N 条)
        # 监控日报的"归档统计"行读 data/monitor_archive_stats.json, 该文件需跨运行累积;
        # DB 已被 actions/cache 保存, 这里再把统计快照提交入库, 防止 cache 被淘汰后丢失历史。
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/monitor_archive_stats.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "auto: monitor archive stats" && git pull --rebase --autostash origin main && git push origin main
          fi
      # DB changes auto-saved to cache by actions/cache@v4 post-job hook

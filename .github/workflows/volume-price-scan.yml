name: volume-price-scan
#
# 价量口诀·盘后选股(做计划)扫描 —— 独立于 momentum-scan, 避免并发 push picks_tracking.json 冲突。
# 盘后(15:30 CST 后)对最新交易日收盘定型数据跑信号, 选突破放量/缩量回踩预选池,
# 给出次日盘中回踩支撑位买点, 脚本自带 Bark 推送计划池 + 写 data/volume_price_plan.json。
# 无信号日也推送 Bark 回执(避免静默误以为未跑)。不做盘中执行(人工次日盘中按量比确认回踩后低吸)。
#
# 数据来源(关键修复): 历史 K线 来自 GitHub Release db-baseline-v1 全量基准库
#   (含完整历史 kline_cache + 基本面); 板块共振所需的 stock_sector_cache 由提交的 CSV 导入;
#   运行时"增量全市场预热"用腾讯公开历史 K线接口(mootdx/tencent, 已本地实测 CI 可用、返回当日数据)
#   把基准库补到当日收盘, 彻底消除"每日数据滞后". 此前的"批量实时行情"路径在 CI 不可达(缓存回声),
#   是滞后的根因, 已弃用. 首次/缓存未命中则下载基准库, 后续命中 state-vpscan 缓存仅补 1 日, 极快.
#
# Triggers:
#   Primary:  cron-job.org → POST workflow_dispatch API   15:30 CST (precision ±1s, 可靠)
#             (本项目 momentum-scan 即用此方式作主触发; GitHub 原生 schedule 已证实在本仓库
#              不可靠 —— momentum-scan 的 schedule 自 2026-07 起停发, volume-price-scan 从未被
#              schedule 触发过. 故本 workflow 依赖 GitHub schedule 会"漏跑", 必须靠 cron-job.org.)
#             cron-job.org 作业示例(POST):
#               URL:  https://api.github.com/repos/Dane666/Momentum/actions/workflows/volume-price-scan.yml/dispatches
#               Method: POST   Headers: Accept: application/vnd.github+json
#                        Authorization: Bearer <GH_PAT_with_workflow_scope>
#               Body(JSON): {"ref":"main"}
#   Backup:   GitHub schedule cron               15:30 CST (本文件下方, 仅作兜底, 可能漏跑)
#   Manual:   GitHub UI "Run workflow" button / gh workflow run
#
on:
  schedule:
    - cron: '30 7 * * 1-5'     # 07:30 UTC = 15:30 CST, 周一至周五
  workflow_dispatch:

concurrency:
  group: volume-price-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      # (B) 回踩低波动确认: 仅保留 vol60 横截面低分位(健康缩量回踩), 提升回踩胜率.
      # 阈值扫描(opt_study/vp_lowvol_threshold_sweep.py, 窗口 2024-07~2026-06)结论:
      #   0.33 -> 胜率44.4%/均笔+0.35%/夏普0.23;  0.50 -> 胜率55.0%/均笔+1.80%/夏普0.94(最优);
      #   0.70/不过滤 信号更密但胜率与夏普回落. 故采用 0.50(信号更密且质量更高).
      # 关闭只需删除/清空这两个变量.
      VP_PULLBACK_LOWVOL: "1"
      VP_PULLBACK_VOL_THR: "0.50"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install mootdx>=0.11

      - name: Restore state cache (DB, dedicated vpscan key)
        # 与 momentum-scan / backtest 的 state-v1 隔离, 避免彼此缓存覆盖导致的空库.
        # 首次运行缓存未命中 -> 下方下载基准库 -> 任务结束自动存入缓存; 后续命中跳过下载.
        uses: actions/cache@v4
        with:
          path: qlib_pro_v16.db
          key: state-vpscan-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-vpscan-${{ runner.os }}-

      - name: Download DB baseline (full-market, 消除历史漂移)
        # 仅当缓存未命中/库过小才从 release db-baseline-v1 下载全量基准库
        # (含完整历史K线+基本面), 使 CI 与本地库历史价一致. 命中缓存则跳过.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f qlib_pro_v16.db ] || [ "$(stat -c%s qlib_pro_v16.db 2>/dev/null || echo 0)" -lt 104857600 ]; then
            echo "DB 缺失或过小(<100MB), 从 release db-baseline-v1 下载全量基准库..."
            gh release download db-baseline-v1 -p qlib_pro_v16.db --clobber
            echo "下载完成: $(du -h qlib_pro_v16.db | cut -f1)"
          else
            echo "DB 已存在(缓存命中), 跳过下载 ($(du -h qlib_pro_v16.db | cut -f1))"
          fi

      - name: Import sector cache into DB (if missing)
        # 板块主线共振(build_hot_themes)需要 stock_sector_cache; 该表不在 CI 缓存里(仅本地/基准库),
        # 从提交的 CSV 导入使主题共振在 CI 中可用. 表已存在则跳过(幂等).
        continue-on-error: true
        run: |
          python <<'PY'
          import os, sqlite3, csv
          db = 'qlib_pro_v16.db'
          if not os.path.exists(db):
              print("DB 不存在, 跳过导入"); raise SystemExit(0)
          con = sqlite3.connect(db)
          def rows(name):
              try: return con.execute(f"SELECT COUNT(*) FROM {name}").fetchone()[0]
              except Exception: return 0
          if rows('stock_sector_cache') == 0 and os.path.exists('data/stock_sector_cache.csv'):
              print("stock_sector_cache 缺失, 从 CSV 导入...", flush=True)
              con.execute("CREATE TABLE IF NOT EXISTS stock_sector_cache (code TEXT, sector TEXT, update_time TEXT)")
              with open('data/stock_sector_cache.csv', newline='', encoding='utf-8') as f:
                  recs = [(r['code'], r['sector'], r['update_time']) for r in csv.DictReader(f)]
              con.executemany("INSERT OR REPLACE INTO stock_sector_cache VALUES (?,?,?)", recs)
              con.commit()
              print(f"  导入 stock_sector_cache {len(recs)} 行", flush=True)
          else:
              print(f"stock_sector_cache: {rows('stock_sector_cache')} 行 (已存在/跳过)", flush=True)
          con.close()
          PY

      - name: Warm full-universe K-line to latest (腾讯历史接口, 消除滞后)
        # 增量全市场预热: 对 kline_cache 现有代码逐只走 load_or_fetch_kline ->
        # fetch_kline_from_api (腾讯公开 HTTP 接口, 本地实测 CI 可用、返回当日数据, 无需本地代理).
        # 仅补基准库之后的新交易日 bar(写库幂等增量), 把数据库补到当日收盘, 彻底消除滞后.
        # 命中 state-vpscan 缓存时库已到昨日, 此步仅补 1 日 -> 极快; 全市场首跑约数分钟.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python <<'PY'
          import logging, sys, sqlite3, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')
          p = Path('.').resolve(); sys.path.insert(0, str(p.parent))
          import importlib.util
          s = importlib.util.spec_from_file_location('momentum', p/'__init__.py', submodule_search_locations=[str(p)])
          m = importlib.util.module_from_spec(s); sys.modules['momentum']=m; s.loader.exec_module(m)
          try:
              from momentum.data import load_or_fetch_kline, fetch_kline_from_api, init_db
              init_db()
              con = sqlite3.connect('qlib_pro_v16.db')
              codes = [r[0] for r in con.execute(
                  "SELECT DISTINCT code FROM kline_cache WHERE code GLOB '60*' OR code GLOB '00*' OR code GLOB '30*' OR code GLOB '68*'").fetchall()]
              con.close()
              codes = [c for c in codes if 'ST' not in c]
              print(f"[warm] 目标 {len(codes)} 只 (kline_cache 现有, 增量补最新交易日)", flush=True)
              t0 = time.time(); ok = fail = 0
              def w(c):
                  try:
                      df = load_or_fetch_kline(c, fetch_kline_from_api, '2024-01-01')
                      return 1 if (df is not None and not df.empty) else 0
                  except Exception:
                      return 0
              with ThreadPoolExecutor(max_workers=20) as pool:
                  futs = {pool.submit(w, c): c for c in codes}
                  for f in as_completed(futs):
                      r = f.result()
                      ok += 1 if r else 0; fail += 0 if r else 1
              print(f"[warm] 完成: {ok} ok / {fail} fail in {time.time()-t0:.0f}s", flush=True)
              con = sqlite3.connect('qlib_pro_v16.db')
              print(f"[warm] kline_cache 最新交易日: {con.execute('SELECT MAX(trade_date) FROM kline_cache').fetchone()[0]}", flush=True)
              con.close()
          except Exception as e:
              print(f"[warm] 预热异常(继续, 扫描将沿用已有数据): {e}")
          PY

      - name: Check China trading day
        id: calendar
        run: |
          IS_OPEN=$(python -c "import chinese_calendar as cc; from datetime import date; print(str(cc.is_workday(date.today())).lower())")
          echo "is_open=$IS_OPEN" >> "$GITHUB_OUTPUT"
          echo "Date trading_day=$IS_OPEN"

      - name: Run volume-price post-close scan (登记计划池 PLAN + Bark + 无信号回执)
        # 注意: 此处不再使用 --no-track, 让价量 PLAN 写入 data/picks_tracking.json(统一真相源),
        #       由 position-monitor 的 5天自动清理(expire_old_picks)负责过期移除, 并随下方 push 回流仓库.
        if: steps.calendar.outputs.is_open == 'true'
        run: python tools/volume_price_scan.py

      - name: Push plan pool (PLAN) to repo
        # 把 CI 登记的价量 PLAN 写回仓库, 使 GitHub 上的 data/picks_tracking.json 能体现
        # "出现 -> 5天后被 expire_old_picks 清理" 的真实效果. 与 momentum-scan/position-monitor
        # 的 push 同样先 rebase 再提交, 规避并发 push 冲突.
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/picks_tracking.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else git pull --rebase origin main && git commit -m "auto: volume-price scan plan pool" && git push origin main; fi

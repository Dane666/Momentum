name: signal-quality-report
#
# 模拟盘信号质量周报 — 自动评估选股信号准确率, 回应总结五"先用模拟盘积累数据"与建议⑦。
# 定时跑 tools/trade_journal.py --evaluate --push, 回溯 picks_tracking.json 中信号后
# 1/3/5/10 日收益, 统计命中率, Bark 推送周报。
#
# 数据: 复用 volume-price-scan 的 state-vpscan 缓存(已被每周5天预热到当日); 缓存未命中则
#       从 db-baseline-v1 下载全量基准库. trade_journal 对缺近期数据的记录自动跳过, 报告仍有效.
#
# Triggers:
#   Primary:  cron-job.org → POST workflow_dispatch API   周一 16:30 CST (precision ±1s)
#             URL:  https://api.github.com/repos/Dane666/Momentum/actions/workflows/signal-quality-report.yml/dispatches
#             Method: POST   Headers: Accept: application/vnd.github+json
#                      Authorization: Bearer <GH_PAT_with_workflow_scope>
#             Body(JSON): {"ref":"main"}
#   Backup:   GitHub schedule cron               周一 16:30 CST (本文件下方, 仅兜底, 可能漏跑)
#   Manual:   GitHub UI "Run workflow" button
#
on:
  schedule:
    - cron: '30 8 * * 1'     # 08:30 UTC = 16:30 CST, 周一
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Restore DB cache (与 volume-price-scan 共享 state-vpscan)
        uses: actions/cache@v4
        with:
          path: qlib_pro_v16.db
          key: state-vpscan-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-vpscan-${{ runner.os }}-

      - name: Download DB baseline (if needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f qlib_pro_v16.db ] || [ "$(stat -c%s qlib_pro_v16.db 2>/dev/null || echo 0)" -lt 104857600 ]; then
            echo "DB 缺失或过小, 从 release db-baseline-v1 下载全量基准库..."
            gh release download db-baseline-v1 -p qlib_pro_v16.db --clobber
            echo "下载完成: $(du -h qlib_pro_v16.db | cut -f1)"
          else
            echo "DB 已存在(缓存命中), 跳过下载 ($(du -h qlib_pro_v16.db | cut -f1))"
          fi

      - name: Run signal quality report (Bark push)
        run: python tools/trade_journal.py --evaluate --push

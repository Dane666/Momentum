name: momentum-backtest

# 合并说明: 原 forward-validation.yml(超跌绩优前向/OOS验证)已并入本工作流,
# 作为独立 job `oversold-quality-validation` 运行 —— 与动量回测并行、互不阻塞,
# 即使回测因网络失败, 前向验证仍会跑出策略收益率. 原 forward-validation.yml 已删除.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run smoke or full backtest
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
      exit_mode:
        description: Exit strategy (original/atr)
        required: false
        default: original
        type: choice
        options:
          - original
          - atr
      days:
        description: Backtest days (65/120)
        required: false
        default: "65"
        type: string
      forward_validation:
        description: Also run 超跌绩优前向/OOS验证 (merge from forward-validation.yml)
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "5 7 * * 5"     # 周五 15:05 CST — 周度动量回测
    - cron: "0 8 1 * *"     # 每月1日 16:00 CST — 含超跌绩优前向验证

permissions:
  contents: write

concurrency:
  group: momentum-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      MOMENTUM_LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install mootdx>=0.11

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            qlib_pro_v16.db
            data/picks_tracking.json
            data/eod_last_date.txt
          key: state-v1-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-v1-${{ runner.os }}-

      - name: Check China trading day
        id: calendar
        run: |
          python <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import chinese_calendar as cc
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          is_open = cc.is_workday(today)
          print(f"Date: {today}, trading_day={is_open}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"is_open={str(is_open).lower()}\n")
          PY

      - name: Pre-fetch K-line (warm cache)
        run: |
          python <<'PY'
          import sys,os,time;from pathlib import Path;p=Path('.').resolve()
          sys.path.insert(0,str(p.parent))
          import importlib.util
          s=importlib.util.spec_from_file_location('momentum',p/'__init__.py',submodule_search_locations=[str(p)])
          m=importlib.util.module_from_spec(s);sys.modules['momentum']=m;s.loader.exec_module(m)
          from momentum.data import load_or_fetch_kline,fetch_all_stock_codes,fetch_kline_from_api,init_db
          from momentum import config as cfg;from concurrent.futures import ThreadPoolExecutor,as_completed
          init_db()
          codes=[c for c in fetch_all_stock_codes() if c.startswith(('60','00')) and 'ST' not in c][:200]
          print(f'Pre-fetching {len(codes)} stocks...');start=time.time();ok=fail=0
          with ThreadPoolExecutor(max_workers=20) as pool:
              fx={pool.submit(load_or_fetch_kline,c,fetch_kline_from_api,cfg.KLINE_START_DATE):c for c in codes}
              for f in as_completed(fx):
                  try:
                      if f.result(timeout=30) is not None: ok+=1
                      else: fail+=1
                  except: fail+=1
          print(f'Pre-fetch: {ok} ok {fail} fail in {time.time()-start:.0f}s')
          PY

      - name: Run unit tests
        run: python -m pytest tests/test_backtest.py tests/test_fetcher.py tests/test_fetcher_local_fallback.py -q

      - name: Smoke backtest (push / manual smoke)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'smoke')
        env:
          MOMENTUM_CODE_LIMIT: "20"
          MOMENTUM_POOL_SIZE: "20"
          MOMENTUM_MAX_IO_WORKERS: "6"
          MOMENTUM_LOG_FILE: backtest_smoke.log
        run: python main.py --mode backtest --days 20 --periods 5 --no-report

      - name: Full backtest (manual full / weekly schedule)
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        env:
          MOMENTUM_POOL_SIZE: "150"
          MOMENTUM_LOG_FILE: backtest_full.log
          MOMENTUM_USE_30M_EXIT: "${{ github.event.inputs.exit_mode == 'atr' }}"
        run: python main.py --mode backtest --days ${{ github.event.inputs.days || 65 }} --periods 5,3 --no-report

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-backtest-artifacts
          path: |
            *.log
            reports/**

  # ─────────────────────────────────────────────────────────────
  #  超跌绩优反弹 · 前向/OOS 验证 (原 forward-validation.yml 合并于此)
  #  与动量回测并行、独立运行; 不依赖实时网络(只读缓存 K线 + 基本面CSV),
  #  故即使在境外 Runner 上也能稳定产出策略收益率.
  # ─────────────────────────────────────────────────────────────
  oversold-quality-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    if: >-
      github.event.schedule == '0 8 1 * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.forward_validation == 'true')
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore state cache (DB + tracker, dedicated validation key)
        # 专用 key 与 backtest job 的 state-v1 隔离, 避免两者缓存互相覆盖导致的非确定性恢复
        # (此前出现过空缓存 686B 覆盖 3.4MB 缓存, 使验证拿到空库). 验证库以全市场预热为准,
        # 独立累积, 月度增量预热才能逐步填满真实样本.
        uses: actions/cache@v4
        with:
          path: |
            qlib_pro_v16.db
            opt_study/oos_tracker.json
          key: state-validation-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-validation-${{ runner.os }}-

      - name: Ensure state paths exist (avoid cache save warning)
        run: |
          mkdir -p opt_study
          if [ ! -f opt_study/oos_tracker.json ]; then echo "[]" > opt_study/oos_tracker.json; fi

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Warm broad kline universe (full market, for OOS validation)
        # CI 缓存只含 momentum-scan 每日预热的 ~200 只, 不足以做全市场超跌扫描.
        # 这里抓取全市场非ST A股完整历史入 DB, 使前向验证能看到真实全样本
        # (境外 Runner 网络受限时尽力而为, 失败不阻断验证).
        continue-on-error: true
        run: |
          python <<'PY'
          import sys,os,time;from pathlib import Path;p=Path('.').resolve()
          sys.path.insert(0,str(p.parent))
          import importlib.util
          s=importlib.util.spec_from_file_location('momentum',p/'__init__.py',submodule_search_locations=[str(p)])
          m=importlib.util.module_from_spec(s);sys.modules['momentum']=m;s.loader.exec_module(m)
          from momentum.data import load_or_fetch_kline,fetch_all_stock_codes,fetch_kline_from_api,init_db
          from momentum import config as cfg;from concurrent.futures import ThreadPoolExecutor,as_completed
          init_db()
          codes=[c for c in fetch_all_stock_codes() if 'ST' not in c]
          print(f'Warming {len(codes)} non-ST A-share codes (full history)...');start=time.time();ok=fail=0
          with ThreadPoolExecutor(max_workers=30) as pool:
              fx={pool.submit(load_or_fetch_kline,c,fetch_kline_from_api,cfg.KLINE_START_DATE):c for c in codes}
              for f in as_completed(fx):
                  try:
                      if f.result(timeout=20) is not None: ok+=1
                      else: fail+=1
                  except: fail+=1
          print(f'Warm done: {ok} ok {fail} fail in {time.time()-start:.0f}s')
          PY

      - name: Import fundamentals & sector cache into DB (if missing)
        # fundamentals / stock_sector_cache 不在 CI 缓存里(仅本地构建), 这里从提交的 CSV 导入,
        # 使"绩优"过滤在 CI 中可用. 表已存在则跳过(幂等). 失败不阻断验证.
        continue-on-error: true
        run: |
          python <<'PY'
          import sqlite3, csv, os
          DB = "qlib_pro_v16.db"
          if not os.path.exists(DB):
              print("DB 不存在: 前向验证将产出'数据未就绪'说明"); raise SystemExit(0)
          con = sqlite3.connect(DB)
          def num(x): return float(x) if (x not in ('', None)) else None
          try:
              con.execute("""CREATE TABLE IF NOT EXISTS fundamentals (
                  code TEXT, period_end TEXT, avail_from TEXT, roe REAL, net_profit_yoy REAL,
                  revenue_yoy REAL, eps REAL, eps_annualized REAL, bvps REAL, industry TEXT,
                  PRIMARY KEY(code, period_end))""")
              with open('data/fundamentals.csv', newline='', encoding='utf-8') as f:
                  rd = csv.DictReader(f)
                  recs = [(r['code'], r['period_end'], r['avail_from'], num(r['roe']),
                           num(r['net_profit_yoy']), num(r['revenue_yoy']), num(r['eps']),
                           num(r['eps_annualized']), num(r['bvps']), (r.get('industry') or None)) for r in rd]
              con.executemany("INSERT OR REPLACE INTO fundamentals VALUES (?,?,?,?,?,?,?,?,?,?)", recs)
              print(f"fundamentals 导入 {len(recs)} 行")
          except Exception as e:
              print("fundamentals 导入跳过:", e)
          try:
              con.execute("CREATE TABLE IF NOT EXISTS stock_sector_cache (code TEXT, sector TEXT, update_time TEXT)")
              with open('data/stock_sector_cache.csv', newline='', encoding='utf-8') as f:
                  rd = csv.DictReader(f)
                  recs2 = [(r['code'], r['sector'], r['update_time']) for r in rd]
              con.executemany("INSERT OR REPLACE INTO stock_sector_cache VALUES (?,?,?)", recs2)
              print(f"stock_sector_cache 导入 {len(recs2)} 行")
          except Exception as e:
              print("stock_sector_cache 导入跳过:", e)
          con.commit(); con.close()
          PY

      - name: 前向验证 (validate --mode auto)
        run: python opt_study/forward_validation.py validate --mode auto

      - name: 当前候选观察清单 (watchlist)
        run: python opt_study/forward_validation.py watchlist --lookback 10

      - name: Upload forward-validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oversold-quality-forward-validation
          path: |
            opt_study/forward_validation_report.html
            opt_study/forward_validation_trades.csv
            opt_study/forward_validation_metrics.json
            opt_study/live_watchlist.html
            opt_study/live_watchlist.csv
            opt_study/oos_tracker.json

      - name: Push tracker back to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add opt_study/oos_tracker.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No tracker changes"; else git commit -m "auto: update oos_tracker (merged into momentum-backtest)" && git pull --rebase origin main && git push origin main; fi

name: momentum-backtest

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run smoke or full backtest
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
      exit_mode:
        description: Exit strategy (original/atr)
        required: false
        default: original
        type: choice
        options:
          - original
          - atr
      days:
        description: Backtest days (65/120)
        required: false
        default: "65"
        type: string
  schedule:
    - cron: "5 7 * * 5"   # 周五 15:05 CST — 收盘后跑

concurrency:
  group: momentum-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      MOMENTUM_LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install mootdx>=0.11

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            qlib_pro_v16.db
            data/picks_tracking.json
            data/eod_last_date.txt
          key: state-v1-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            state-v1-${{ runner.os }}-

      - name: Check China trading day
        id: calendar
        run: |
          python <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import chinese_calendar as cc
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          is_open = cc.is_workday(today)
          print(f"Date: {today}, trading_day={is_open}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"is_open={str(is_open).lower()}\n")
          PY

      - name: Pre-fetch K-line (warm cache)
        run: |
          python <<'PY'
          import sys,os,time;from pathlib import Path;p=Path('.').resolve()
          sys.path.insert(0,str(p.parent))
          import importlib.util
          s=importlib.util.spec_from_file_location('momentum',p/'__init__.py',submodule_search_locations=[str(p)])
          m=importlib.util.module_from_spec(s);sys.modules['momentum']=m;s.loader.exec_module(m)
          from momentum.data import load_or_fetch_kline,fetch_all_stock_codes,fetch_kline_from_api,init_db
          from momentum import config as cfg;from concurrent.futures import ThreadPoolExecutor,as_completed
          init_db()
          codes=[c for c in fetch_all_stock_codes() if c.startswith(('60','00')) and 'ST' not in c][:200]
          print(f'Pre-fetching {len(codes)} stocks...');start=time.time();ok=fail=0
          with ThreadPoolExecutor(max_workers=20) as pool:
              fx={pool.submit(load_or_fetch_kline,c,fetch_kline_from_api,cfg.KLINE_START_DATE):c for c in codes}
              for f in as_completed(fx):
                  try:
                      if f.result(timeout=30) is not None: ok+=1
                      else: fail+=1
                  except: fail+=1
          print(f'Pre-fetch: {ok} ok {fail} fail in {time.time()-start:.0f}s')
          PY

      - name: Run unit tests
        run: python -m pytest tests/test_backtest.py tests/test_fetcher.py tests/test_fetcher_local_fallback.py -q

      - name: Smoke backtest (push / manual smoke)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'smoke')
        env:
          MOMENTUM_CODE_LIMIT: "20"
          MOMENTUM_POOL_SIZE: "20"
          MOMENTUM_MAX_IO_WORKERS: "6"
          MOMENTUM_LOG_FILE: backtest_smoke.log
        run: python main.py --mode backtest --days 20 --periods 5 --no-report

      - name: Full backtest (manual full / weekly schedule)
        if: >
          (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full') ||
          (github.event_name == 'schedule' && steps.calendar.outputs.is_open == 'true')
        env:
          MOMENTUM_POOL_SIZE: "150"
          MOMENTUM_LOG_FILE: backtest_full.log
          MOMENTUM_USE_30M_EXIT: "${{ github.event.inputs.exit_mode == 'atr' }}"
        run: python main.py --mode backtest --days ${{ github.event.inputs.days || 65 }} --periods 5,3 --no-report

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-backtest-artifacts
          path: |
            *.log
            reports/**
